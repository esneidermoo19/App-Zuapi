openapi: 3.1.0
info:
  title: Conversor API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Estado del servicio
      operationId: health
      responses:
        "200":
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
